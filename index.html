<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IPTV Brasil</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:14px;background:#10141c;position:sticky;top:0;z-index:10;border-bottom:1px solid #252b36}
h1{font-size:20px;margin:0 0 10px}.row{display:flex;gap:7px;overflow:auto;padding-bottom:3px}
button,select,input{border:1px solid #303746;background:#191e28;color:white;border-radius:9px;padding:10px;font-size:14px}
button{white-space:nowrap}.active{background:#3a5cff!important;border-color:#5874ff}
input{width:100%;margin-top:8px}
#status{font-size:12px;color:#929aaa;margin-top:8px}
main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 116px)}
aside{overflow:auto;border-right:1px solid #252b36}.item{display:flex;align-items:center;gap:9px;padding:9px;margin:3px 5px;border-radius:9px}.item:active,.item.sel{background:#202631}
.logo{width:38px;height:38px;object-fit:contain;background:#141820;border-radius:6px;padding:3px;flex:none}
.name{font-size:14px;font-weight:600}.meta{font-size:11px;color:#929aaa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
section{padding:15px;overflow:auto}.screen{background:#000;border-radius:10px;min-height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{width:100%;max-height:70vh;background:#000}.empty{text-align:center;color:#8d95a5;padding:60px 15px}
h2{font-size:18px;margin:12px 0 4px}.hint{color:#929aaa;font-size:12px}
@media(max-width:750px){main{display:block;height:auto}aside{height:43vh;border-right:0;border-bottom:1px solid #252b36}.screen{min-height:210px}section{padding:10px}}
</style>
</head>
<body>
<header>
<h1>ðº IPTV Brasil</h1>
<div class="row" id="lists"></div>
<input id="search" placeholder="ð Pesquisar canal">
<div id="status">Escolha uma lista...</div>
</header>
<main>
<aside id="channels"></aside>
<section>
<div class="screen" id="screen"><div class="empty">Selecione um canal</div></div>
<div id="info"></div>
</section>
</main>
<script>
const LISTS=[
 ["ð§ð· Brasil","https://iptv-org.github.io/iptv/countries/br.m3u"],
 ["ð§ð· ParanÃ¡","https://iptv-org.github.io/iptv/subdivisions/br-pr.m3u"],
 ["ð AmÃ©rica","https://iptv-org.github.io/iptv/regions/amer.m3u"],
 ["ð AmÃ©rica do Sul","https://iptv-org.github.io/iptv/regions/southam.m3u"],
 ["ð Mundo","https://iptv-org.github.io/iptv/index.m3u"]
];
let channels=[],hls=null;

const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function attr(s,k){let m=s.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1]:''}
function parse(t){
 let a=[],m=null;
 for(let l of t.replace(/^\uFEFF/,'').split(/\r?\n/)){
  l=l.trim();if(!l)continue;
  if(l.startsWith('#EXTINF')){
   let comma=l.indexOf(',');
   m={name:comma>=0?l.slice(comma+1).trim():'Canal',logo:attr(l,'tvg-logo'),group:attr(l,'group-title'),country:attr(l,'tvg-country')};
  }else if(!l.startsWith('#')&&m){a.push({...m,url:l});m=null}
 }
 return a;
}
function render(){
 let q=$('search').value.toLowerCase();
 let a=channels.filter(c=>c.name.toLowerCase().includes(q));
 $('channels').innerHTML='';
 a.slice(0,2000).forEach(c=>{
  let d=document.createElement('div');d.className='item';
  d.innerHTML=(c.logo?`<img class="logo" src="${esc(c.logo)}" onerror="this.style.display='none'">`:'<div class="logo">ðº</div>')+
  `<div style="min-width:0"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.group||c.country||'TV')}</div></div>`;
  d.onclick=()=>play(c,d);$('channels').appendChild(d);
 });
 $('status').textContent=`${a.length.toLocaleString('pt-BR')} canais`;
}
async function load(url,btn){
 document.querySelectorAll('#lists button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
 $('status').textContent='Carregando lista...';$('channels').innerHTML='<div class="empty">Aguarde...</div>';
 try{
  let r=await fetch(url,{cache:'no-store',mode:'cors'});
  if(!r.ok)throw Error('HTTP '+r.status);
  let t=await r.text();channels=parse(t);
  if(!channels.length)throw Error('Nenhum canal encontrado');
  render();
 }catch(e){
  $('status').textContent='NÃ£o foi possÃ­vel carregar esta lista.';
  $('channels').innerHTML=`<div class="empty">Erro ao acessar a playlist.<br><br>Em iPhone, o site precisa estar hospedado em HTTPS. A playlist tambÃ©m precisa permitir acesso pelo navegador (CORS).</div>`;
 }
}
function play(c,el){
 document.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
 if(hls){hls.destroy();hls=null}
 $('screen').innerHTML='<video id="video" controls playsinline webkit-playsinline></video>';
 let v=$('video'),url=c.url;
 $('info').innerHTML=`<h2>${esc(c.name)}</h2><div class="hint">${esc(c.group||'')} ${c.country?'â¢ '+esc(c.country):''}</div>`;
 if(/\.m3u8($|\?)/i.test(url)&&Hls.isSupported()){
  hls=new Hls({lowLatencyMode:false});hls.loadSource(url);hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$('info').innerHTML+=`<div class="hint">â ï¸ Este canal nÃ£o aceita reproduÃ§Ã£o neste navegador.</div>`});
 }else{
  v.src=url;v.play().catch(()=>{$('info').innerHTML+=`<div class="hint">â ï¸ Toque no â¶ï¸. Se nÃ£o iniciar, o servidor do canal pode nÃ£o ser compatÃ­vel com iPhone.</div>`});
 }
}
LISTS.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>load(x[1],b);$('lists').appendChild(b);if(i===0)setTimeout(()=>load(x[1],b),50)});
$('search').oninput=render;
</script>
</body>
</html>
